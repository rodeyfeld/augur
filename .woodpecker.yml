variables:
  - &docker_creds
    username:
      from_secret: docker_username
    password:
      from_secret: docker_password

steps:
  build:
    image: woodpeckerci/plugin-docker-buildx
    settings:
      repo: edrodefeld/augur
      target: prod
      auto_tag: true
      <<: *docker_creds
    when:
      - event: [push, manual]
        branch: main

  sync-secrets:
    image: bitnami/kubectl
    environment:
      BAO_ADDR: https://cuneiform.pinwheel.fan
      BAO_TOKEN:
        from_secret: cuneiform_token
    commands:
      - |
        # Install bao CLI
        wget -q https://github.com/openbao/openbao/releases/download/v2.1.0/bao_2.1.0_linux_amd64.tar.gz
        tar -xzf bao_2.1.0_linux_amd64.tar.gz
        chmod +x bao
        
        # Fetch secrets from Cuneiform
        ./bao kv get -format=json galaxy-kv/prod/augur > /tmp/secrets.json
        
        # Create K8s secret
        kubectl create secret generic augur-env-secrets \
          --from-literal=AUGUR_SECRET_KEY="$(cat /tmp/secrets.json | jq -r '.data.data.secret_key')" \
          --from-literal=AUGUR_DB_PASSWORD="$(cat /tmp/secrets.json | jq -r '.data.data.db_password')" \
          --from-literal=AUGUR_DREAMFLOW_PASSWORD="$(cat /tmp/secrets.json | jq -r '.data.data.dreamflow_password')" \
          -n galaxy --dry-run=client -o yaml | kubectl apply -f -
    when:
      - event: [push, manual]
        branch: main

  deploy:
    image: bitnami/kubectl
    commands:
      - kubectl rollout restart deployment/augur -n galaxy
    when:
      - event: [push, manual]
        branch: main
