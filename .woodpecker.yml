variables:
  - &docker_creds
    username:
      from_secret: docker_username
    password:
      from_secret: docker_password

steps:
  build:
    image: woodpeckerci/plugin-docker-buildx
    settings:
      repo: edrodefeld/augur
      target: prod
      auto_tag: true
      <<: *docker_creds
    when:
      - event: [push, manual]
        branch: main

  sync-secrets:
    image: alpine:3.22.2
    environment:
      BAO_ADDR: https://cuneiform.pinwheel.fan
      BAO_TOKEN:
        from_secret: cuneiform_token
    commands:
      # Install dependencies
      - apk add --no-cache curl jq zip

      # Install kubectl
      - curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
      - chmod +x kubectl
      - mv kubectl /usr/local/bin/

      # Install bao CLI
      - curl -L -o bao.zip https://github.com/openbao/openbao/releases/download/v2.1.0/bao_2.1.0_linux_amd64.zip
      - unzip bao.zip
      - chmod +x bao

      # Fetch secrets from Cuneiform
      - ./bao kv get -format=json galaxy-kv/prod/augur > /tmp/secrets.json
      
      # Create K8s secret
      - |
        kubectl create secret generic augur-env-secrets \
          --from-literal=AUGUR_SECRET_KEY="$(cat /tmp/secrets.json | jq -r '.data.data.AUGUR_SECRET_KEY')" \
          --from-literal=AUGUR_DB_PASSWORD="$(cat /tmp/secrets.json | jq -r '.data.data.AUGUR_DB_PASSWORD')" \
          --from-literal=AUGUR_DREAMFLOW_PASSWORD="$(cat /tmp/secrets.json | jq -r '.data.data.AUGUR_DREAMFLOW_PASSWORD')" \
          -n galaxy --dry-run=client -o yaml | kubectl apply -f -
    when:
      - event: [push, manual]
        branch: main

  deploy:
    image: bitnami/kubectl
    commands:
      - kubectl rollout restart deployment/augur -n galaxy
    when:
      - event: [push, manual]
        branch: main
